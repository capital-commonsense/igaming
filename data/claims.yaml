# Claims used in the figures, each tied to a source in data/sources/manifest.yaml.
#
# `quotes` are verbatim snippets that must appear in the source's extracted text
# (after whitespace/quote/ligature normalization). tests/test_claims.py checks every
# one, so a figure number can't drift from what the source actually says.
# `value` is what the figure plots or prints.

