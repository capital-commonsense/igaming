</g>
<text x="100" y="920" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">How the money is counted: the $1 is DC players’ combined net loss, meaning everything wagered minus everything paid back as winnings, including to players who finish ahead. That</text>
<text x="100" y="944.65" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">equals operators’ adjusted gross revenue, the tax base; the committee print doesn’t count promotional credits as wagers. The CFO’s fiscal 2030 figures imply $66.8M a year (each 2%</text>
<text x="100" y="969.3" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">assessment is $1.34M). Every cent is accounted for: the out-of-state share is what remains.</text>
<text x="100" y="1001.95" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">What the city gets: a 25% tax (12.5% on live-dealer games; the CFO’s figures imply 24.05% overall), with the first $750K for addiction services; a 2% community impact assessment</text>
<text x="100" y="1026.6" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">for debt counseling, domestic-violence services, gambling research and youth tech training; license fees; and a 2% regulatory assessment that only pays for regulating the market. The</text>
<text x="100" y="1051.25" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">red slices total 26.3¢. The CFO also projects the city loses $1.65M a year in lottery and sports-betting revenue (2.5¢ per $1), for a net gain of $15.90M: 23.8¢ per $1.</text>
<text x="100" y="1083.9" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Assumes 100 union dealer jobs (the committee’s estimate; the bill requires live-dealer games in a DC studio) at $70K each, fully loaded, and $3.0M a year in DC vendor spending.</text>
<text x="100" y="1116.55" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Union dues: $105 a month ($1,260 a year) per dealer, the top of the regular dues range ($59.92–$105.00 a month) UNITE HERE Local 25 reported to the U.S. Department of Labor for</text>
<text x="100" y="1141.2" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">2025. That matches the local's actual 2025 dues receipts: $7.8M from 6,101 members, or $1,274 each. 100 dealers would pay $126K a year, 0.19¢ of each $1 residents lose.</text>
<text x="100" y="1173.85" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Sources: DC Chief Financial Officer, fiscal impact statement on the B26-0656 committee print (Nov. 18, 2026); committee print racial equity impact assessment; committee jobs</text>
<text x="100" y="1198.5" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">estimate via Axios DC (Nov. 18, 2026); UNITE HERE Local 25 2025 LM-2 filing (U.S. Dept. of Labor).</text>
</svg>