<text x="100" y="166" font-size="23" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Where DC residents’ net online casino losses would go under B26-0656, cents per $1 (DC CFO estimate for fiscal 2030)</text>
<text x="100" y="262" font-size="22" font-weight="600" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">$1 lost by DC players, net of winnings</text>
<text x="1210" y="262" font-size="22" font-weight="600" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">Or: $1 of income tax</text>
