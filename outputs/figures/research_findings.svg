<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1343.95" width="1600" height="1343.95" role="img" aria-label="What researchers find when gambling moves onto phones">
<title>What researchers find when gambling moves onto phones</title>
<rect width="1600" height="1343.95" fill="#FFFFFF"/>
<text x="100" y="112" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="50" fill="#111111">What researchers find when gambling moves onto phones</text>
<text x="100" y="160" font-size="23" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Research and help-seeking data from outside DC</text>
<text x="100" y="220" font-size="15" font-weight="600" fill="#5B5B5B" letter-spacing="1.5" font-family="'IBM Plex Sans', Arial, sans-serif">MONEY</text>
<line x1="100" x2="534.67" y1="238" y2="238" stroke="#D43D29" stroke-width="3"/>
<text x="100" y="316" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#D43D29" data-key="bankruptcy">+25–30%</text>
<text x="100" y="362" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#D43D29" data-key="bankruptcy">bankruptcy risk</text>
<text x="100" y="402" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">at the high end, three to four years after a state's</text>
<text x="100" y="428" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">online sports betting launch</text>
<text x="100" y="488" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online sports betting · ~7M consumers</text>
<text x="100" y="509" font-size="15" fill="#5B5B5B" data-cite="bankruptcy" font-family="'IBM Plex Sans', Arial, sans-serif">Hollenbeck, Larsen &amp; Proserpio, working paper (Oct. 2024)</text>
<line x1="582.67" x2="1017.33" y1="238" y2="238" stroke="#111111" stroke-width="3"/>
<text x="582.67" y="316" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="collections">+8%</text>
<text x="582.67" y="362" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="collections">debt in collections</text>
<text x="582.67" y="402" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">approximate rise in the average amount owed after</text>
<text x="582.67" y="428" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">online sports betting became legal</text>
<text x="582.67" y="488" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online sports betting · ~7M consumers</text>
<text x="582.67" y="509" font-size="15" fill="#5B5B5B" data-cite="collections" font-family="'IBM Plex Sans', Arial, sans-serif">Hollenbeck, Larsen &amp; Proserpio, working paper (Oct. 2024)</text>
<line x1="1065.33" x2="1500" y1="238" y2="238" stroke="#111111" stroke-width="3"/>
<text x="1065.33" y="316" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="investment_crowd_out">−$0.99</text>
<text x="1065.33" y="362" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="investment_crowd_out">investment/savings</text>
<text x="1065.33" y="402" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">for every $1 bet on sports online. Among strapped</text>
<text x="1065.33" y="428" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">households, card debt and overdrafts rise</text>
<text x="1065.33" y="488" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online sports betting · bank transactions</text>
<text x="1065.33" y="509" font-size="15" fill="#5B5B5B" data-cite="investment_crowd_out" font-family="'IBM Plex Sans', Arial, sans-serif">Baker et al., NBER WP 33108 (2024)</text>
<text x="100" y="554" font-size="15" font-weight="600" fill="#5B5B5B" letter-spacing="1.5" font-family="'IBM Plex Sans', Arial, sans-serif">RISK, HEALTH AND WHO PAYS</text>
<line x1="100" x2="534.67" y1="572" y2="572" stroke="#111111" stroke-width="3"/>
<text x="100" y="650" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="uk_online_slots_pgsi">5×</text>
<text x="100" y="696" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="uk_online_slots_pgsi">problem-gambling rate</text>
<text x="100" y="736" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">among people who played online slots in the past</text>
<text x="100" y="762" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">year vs. all gamblers in Great Britain</text>
<text x="100" y="822" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Association · Great Britain, 2023 survey</text>
<text x="100" y="843" font-size="15" fill="#5B5B5B" data-cite="uk_online_slots_pgsi" font-family="'IBM Plex Sans', Arial, sans-serif">UK Gambling Commission (2025)</text>
<line x1="582.67" x2="1017.33" y1="572" y2="572" stroke="#111111" stroke-width="3"/>
<text x="582.67" y="650" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="suicide">15×</text>
<text x="582.67" y="696" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="suicide">suicide mortality</text>
<text x="582.67" y="736" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">vs. the general population, among Swedish</text>
<text x="582.67" y="762" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">patients aged 20–74 with diagnosed gambling</text>
<text x="582.67" y="788" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">disorder</text>
<text x="582.67" y="822" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Association · Swedish clinical cohort</text>
<text x="582.67" y="843" font-size="15" fill="#5B5B5B" data-cite="suicide" font-family="'IBM Plex Sans', Arial, sans-serif">Karlsson &amp; Håkansson, J. Behavioral Addictions (2018)</text>
<line x1="1065.33" x2="1500" y1="572" y2="572" stroke="#111111" stroke-width="3"/>
<text x="1065.33" y="650" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="anj_concentration">60%</text>
<text x="1065.33" y="696" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="anj_concentration">from problem gamblers</text>
<text x="1065.33" y="736" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">of French online and account-based gambling</text>
<text x="1065.33" y="762" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">revenue came from the 8.7% of players flagged as</text>
<text x="1065.33" y="788" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">likely problem gamblers</text>
<text x="1065.33" y="822" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online + account-based gambling · France, H2 2025</text>
<text x="1065.33" y="843" font-size="15" fill="#5B5B5B" data-cite="anj_concentration" font-family="'IBM Plex Sans', Arial, sans-serif">France ANJ (2026)</text>
<text x="100" y="888" font-size="15" font-weight="600" fill="#5B5B5B" letter-spacing="1.5" font-family="'IBM Plex Sans', Arial, sans-serif">PROBLEM GAMBLING</text>
<line x1="100" x2="534.67" y1="906" y2="906" stroke="#111111" stroke-width="3"/>
<text x="100" y="984" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="nj_venue_disorder">10×</text>
<text x="100" y="1030" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="nj_venue_disorder">gambling-disorder rate</text>
<text x="100" y="1070" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">among New Jersey gamblers who bet only online</text>
<text x="100" y="1096" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">(11.3%) vs. only in person (1.1%)</text>
<text x="100" y="1156" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Association · New Jersey, 2020–21 survey</text>
<text x="100" y="1177" font-size="15" fill="#5B5B5B" data-cite="nj_venue_disorder" font-family="'IBM Plex Sans', Arial, sans-serif">Nower, Stanmyre &amp; Anthony, Rutgers report to NJ DGE (2023)</text>
<line x1="582.67" x2="1017.33" y1="906" y2="906" stroke="#111111" stroke-width="3"/>
<text x="582.67" y="984" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="ct_helpline">+87%</text>
<text x="582.67" y="1030" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="ct_helpline">helpline calls</text>
<text x="582.67" y="1070" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">and texts to Connecticut's problem-gambling</text>
<text x="582.67" y="1096" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">helpline, Nov. 2021 vs. Nov. 2020</text>
<text x="582.67" y="1156" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online casino + sports betting · Connecticut</text>
<text x="582.67" y="1177" font-size="15" fill="#5B5B5B" data-cite="ct_helpline" font-family="'IBM Plex Sans', Arial, sans-serif">CT Mirror (Jan. 23, 2022)</text>
<line x1="1065.33" x2="1500" y1="906" y2="906" stroke="#111111" stroke-width="3"/>
<text x="1065.33" y="984" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="68" fill="#111111" data-key="pa_helpline">50%+</text>
<text x="1065.33" y="1030" font-family="'Newsreader 72pt', Newsreader, Georgia, serif" font-weight="700" font-size="36" fill="#111111" data-key="pa_helpline">online-gambling calls</text>
<text x="1065.33" y="1070" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">of calls to Pennsylvania's problem-gambling</text>
<text x="1065.33" y="1096" font-size="19" fill="#111111" font-family="'IBM Plex Sans', Arial, sans-serif">helpline involved problematic online gambling</text>
<text x="1065.33" y="1156" font-size="15" font-weight="600" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Online casino + sports betting · Pennsylvania</text>
<text x="1065.33" y="1177" font-size="15" fill="#5B5B5B" data-cite="pa_helpline" font-family="'IBM Plex Sans', Arial, sans-serif">Penn State SSRI, 2025 PA online gambling report</text>
<text x="100" y="1232" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">None of these are DC estimates. The financial findings cover sports betting; few studies isolate online casino games. Connecticut launched online casino games and sports betting</text>
<text x="100" y="1256.65" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">together. Helpline figures measure service contacts. The British, New Jersey and Swedish results compare groups of people and do not show that gambling caused the differences.</text>
<text x="100" y="1289.3" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Sources as cited in each panel.</text>
</svg>