<text x="1346" y="718.4" font-size="17" fill="#5B5B5B" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">Actual</text>
<text x="1277" y="780.4" font-size="20" font-weight="600" fill="#111111" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">Online casino (B26-0656)</text>
<text x="1277" y="804.4" font-size="18" fill="#5B5B5B" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">fiscal 2030</text>
<line x1="180" x2="1500" y1="688.4" y2="688.4" stroke="#111111" stroke-width="2"/>
<text x="100" y="868.4" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">GambetDC actuals are net transfers to the District reported by the DC Office of Lottery and Gaming. In FY2021 GambetDC made no net transfer and lost $4M. Projections are as</text>
<text x="100" y="893.05" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">reported at the time. The online casino figure is the DC Chief Financial Officer’s projected net impact on District resources in fiscal 2030, from its fiscal impact statement on the</text>
<text x="100" y="917.7" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">committee print. Lawmakers have cited $73M in tax over four years, and another analysis cited at markup put it near $50M a year.</text>
<text x="100" y="942.35" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">GambetDC was a lottery-run monopoly. B26-0656 licenses competing national operators, so it may come closer to its estimate, which would mean residents lose more. This compares</text>
<text x="100" y="967" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">DC's track record; it is not a forecast.</text>
<text x="100" y="999.65" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">Sources: Casino.org, citing DCist (Mar. 2022); DC Office of Lottery and Gaming, FY21-22 oversight presentation; DCist (Mar. 3, 2022); DC Office of Lottery and Gaming, FY22-23</text>
<text x="100" y="1024.3" font-size="17" fill="#5B5B5B" font-family="'IBM Plex Sans', Arial, sans-serif">oversight slides; DC Chief Financial Officer, fiscal impact statement on B26-0656 committee print (Nov. 18, 2026); Axios DC (Nov. 18, 2026); Covers (Nov. 18, 2026).</text>
</svg>